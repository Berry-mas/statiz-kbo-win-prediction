name: Publish public results

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-public-results.yml"
      - "src/public_results.py"
      - "src/submission_log.py"
      - "src/constants.py"
      - "scripts/server_publish_public_results.sh"
      - "scripts/publish_public_results.sh"

concurrency:
  group: publish-public-results
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate secrets
        run: |
          test -n "${{ secrets.LIGHTSAIL_HOST }}"
          test -n "${{ secrets.LIGHTSAIL_USER }}"
          test -n "${{ secrets.LIGHTSAIL_SSH_KEY }}"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/lightsail_key
          chmod 600 ~/.ssh/lightsail_key
          ssh-keyscan -H "${{ secrets.LIGHTSAIL_HOST }}" >> ~/.ssh/known_hosts

      - name: Publish results on Lightsail
        run: |
          remote_cmd='set -euo pipefail; cd /home/ubuntu/statiz_code; git checkout main; git pull --ff-only origin main; ./scripts/server_publish_public_results.sh'
          ssh -i ~/.ssh/lightsail_key \
            -o IdentitiesOnly=yes \
            "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}" \
            "$remote_cmd"
